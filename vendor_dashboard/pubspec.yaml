name: vendor_dashboard
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI Components & Icons
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.3.0
  hugeicons: ^0.0.7
  pinput: ^6.0.2
  toastification: ^3.2.0

  # State Management & Architecture
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  equatable: ^2.1.0
  dartz: ^0.10.1

  # Routing & Storage
  go_router: ^17.4.0
  flutter_secure_storage: ^11.0.0

  # Networking
  dio: ^5.11.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.4
  internet_connection_checker_plus: ^3.1.1

  # Maps & Location Services
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  nominatim_flutter: ^0.0.8
  nominatim_geocoding: ^0.0.6
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true